<title>GV Relation Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky bar (title, mode, sections), definitions column left, note panel right (bottom sheet on phones). */
:root {
  --bg: #f4f6f8;
  --panel: #ffffff;
  --fg: #19202a;
  --muted: #5b6676;
  --line: #d9dee5;
  --accent: #1f6f78;
  --accent-soft: #dcecee;
  --hot: #b5560f;
  --hot-soft: #fbe7d6;
  --df: #3a5a9c;
  --live: #1f6f78;
  --lf: #7a4c9a;
  --lf-soft: #f4edf9;
  --display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161c; --panel: #1a2029; --fg: #e3e8ef; --muted: #98a3b3; --line: #2c3540;
  --accent: #5fb3bb; --accent-soft: #1d3438; --hot: #f0a060; --hot-soft: #3a2a1c;
  --df: #8fa9e0; --live: #5fb3bb; --lf: #c39be0; --lf-soft: #2b2235; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1a2029; --fg: #e3e8ef; --muted: #98a3b3; --line: #2c3540;
  --accent: #5fb3bb; --accent-soft: #1d3438; --hot: #f0a060; --hot-soft: #3a2a1c;
  --df: #8fa9e0; --live: #5fb3bb; --lf: #c39be0; --lf-soft: #2b2235; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; max-width: 2200px; margin: 0 auto; }
h1 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; margin: 0; letter-spacing: 0.005em; }
h1 small { font-family: var(--body); font-weight: 400; font-size: 0.8rem; color: var(--muted); margin-left: 8px; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.modes button { font: 500 0.82rem var(--body); padding: 6px 12px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.modes button + button { border-left: 1px solid var(--line); }
.modes button[aria-pressed="true"] { color: #fff; }
.modes button[data-mode="df"][aria-pressed="true"] { background: var(--df); }
.ann { fill: var(--lf); color: var(--lf); }
.block.lfonly, .ex.lfonly { background: var(--lf-soft); border-color: var(--lf); }
.block.lfonly .ann { fill: currentColor; color: inherit; }
.flip { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; font: 500 0.66rem var(--body); letter-spacing: 0.04em; }
.flip button { border: 0; background: transparent; color: var(--muted); padding: 1px 6px; cursor: pointer; font: inherit; }
.flip button[aria-pressed="true"][data-m="df"] { background: var(--df); color: #fff; }
.flip button[aria-pressed="true"][data-m="lf"] { background: var(--lf); color: #fff; }
.modes button[data-mode="lf"][aria-pressed="true"] { background: var(--lf); }
:root[data-theme="dark"] .modes button[aria-pressed="true"] { color: #10141a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .modes button[aria-pressed="true"] { color: #10141a; } }
.search { flex: 1 1 180px; max-width: 280px; }
.search input { width: 100%; box-sizing: border-box; font: 0.85rem var(--body); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 2200px; margin: 0 auto; scrollbar-width: thin; }
nav.tabs a { flex: none; font: 500 0.85rem var(--body); color: var(--muted); text-decoration: none; padding: 8px 12px; border-bottom: 2px solid transparent; }
nav.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 24px; max-width: 2200px; margin: 0 auto; padding-block: 20px 60px; }
@media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
.intro { font-family: var(--display); font-size: 1.12rem; line-height: 1.55; max-width: 68ch; margin: 0 0 18px; color: var(--fg); }
.legend { font-size: 0.8rem; color: var(--muted); margin: -8px 0 18px; }
.legend b { color: var(--hot); font-weight: 600; }

.block { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 12px; margin-bottom: 14px; }
.block h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 6px; font: 600 0.95rem var(--body); }
.block h3 code { font: 0.75rem var(--mono); color: var(--muted); font-weight: 400; }
.tags { display: inline-flex; gap: 4px; margin-left: auto; }
.tag { font: 500 0.68rem var(--body); letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid currentColor; }
.tag.df { color: var(--df); } .tag.live { color: var(--live); } .tag.lf { color: var(--lf); }
.tag.planned { color: var(--muted); border-style: dashed; cursor: help; }
.math { padding: 6px 0; }
.math { overflow: hidden; }
.math mjx-container { display: block !important; margin: 4px 0 !important; max-width: 100%; min-width: 0 !important; }
.math mjx-container svg { max-width: 100% !important; height: auto !important; }
.caption { font-size: 0.86rem; color: var(--muted); margin: 6px 0 0; max-width: 72ch; }
.block.flash { box-shadow: 0 0 0 2px var(--hot); }

/* hover targets inside formulas */
.math [class*="k-"] { cursor: help; }
.math rect.lr-hit { fill: transparent; stroke: none; pointer-events: all; }
.math rect.lr-box { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 18; pointer-events: none; }
.math rect.lr-box.pin { stroke-width: 36; }

aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); align-self: start; max-height: calc(100vh - 130px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
@media (max-width: 900px) { aside { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 46vh; border-radius: 12px 12px 0 0; z-index: 6; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -6px 24px rgba(0,0,0,.12); } aside.empty { display: none; } main { padding-bottom: 50vh; } }
aside .eyebrow { font: 600 0.7rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
aside .eyebrow button { font: 500 0.75rem var(--body); border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.block h3[data-block] { cursor: pointer; }
.ex h3[data-ex] { cursor: help; }
.ex { cursor: pointer; }
aside h2 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 6px 0 10px; text-wrap: balance; }
aside dl { margin: 0; display: grid; gap: 10px; }
aside dt { font: 600 0.72rem var(--body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
aside dd { margin: 2px 0 0; font-size: 0.95rem; line-height: 1.55; }
aside mjx-container { font-size: 105%; }
aside dd.sig { overflow: hidden; }
aside dd.sig mjx-container { display: block !important; max-width: 100%; min-width: 0 !important; overflow: hidden; margin: 2px 0 !important; }
aside dd.sig mjx-container svg { max-width: 100% !important; height: auto !important; }
aside ul.args { margin: 2px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.88rem; }
aside dd.breaks { border-left: 3px solid var(--hot); padding-left: 8px; }
aside code, .caption code, .ex code { font-family: var(--mono); font-size: 0.85em; }
aside .uses { margin-top: 14px; font-size: 0.82rem; color: var(--muted); }
aside .uses .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
aside .uses a { color: var(--accent); text-decoration: none; padding: 2px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); max-width: 100%; overflow-wrap: anywhere; }
aside .uses a:hover { border-color: var(--accent); }
aside .placeholder { color: var(--muted); font-size: 0.9rem; }

.ex { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
.ex h3 { margin: 0 0 6px; font: 600 0.95rem var(--body); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.ex pre { margin: 8px 0; padding: 10px 12px; background: var(--bg); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.82rem/1.5 var(--mono); }
.ex pre .kw { color: var(--df); font-weight: 500; }
.ex pre .op { color: var(--lf); }
.ex pre .num { color: var(--hot); }
.ex pre .com { color: var(--muted); font-style: italic; }
.ex pre .ty { color: var(--accent); }
.ex p { margin: 6px 0 0; font-size: 0.9rem; }
.ex p.lead { font-size: 0.95rem; color: var(--fg); margin: 6px 0 4px; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.badge { display: inline-flex; align-items: baseline; gap: 4px; font: 500 0.78rem var(--body); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
.badge .mark { font-weight: 700; }
.badge.yes { border-color: var(--accent); background: var(--accent-soft); }
.badge.yes .mark { color: var(--accent); }
.badge.no { border-color: var(--hot); background: var(--hot-soft); }
.badge.no .mark { color: var(--hot); }
.badge.na { color: var(--muted); }
.badge .nm { color: var(--muted); }
.empty-state { color: var(--muted); padding: 30px 0; }
@media (prefers-reduced-motion: no-preference) { .block, .ex { transition: box-shadow .2s; } }
</style>

<header class="wrap">
  <div class="bar">
    <h1>GV Relation Map <small>v2 definitions, rules and theorems</small></h1>
    <div class="modes" role="group" aria-label="Instance">
      <button type="button" data-mode="df" aria-pressed="true">Deadlock free</button>
      <button type="button" data-mode="lf" aria-pressed="false">Lock free</button>
    </div>
    <label class="search"><input id="q" type="search" placeholder="Filter rules and clauses" aria-label="Filter"></label>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>

<main class="wrap">
  <section id="content" aria-live="polite"><p class="empty-state">Loading definitions…</p></section>
  <aside id="note" class="empty" aria-label="Explanation">
    <div class="placeholder">Point at a formula part or a title.</div>
  </aside>
</main>

<script>
window.MathJax = {
  loader: { load: ['[tex]/html'] },
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], processEscapes: true, packages: { '[+]': ['html'] }, macros: { llbracket: '[\\![', rrbracket: ']\\!]' } },
  svg: { fontCache: 'global' },
  startup: { typeset: false, ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => window.__mjReady && window.__mjReady()); } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js"></script>
<script src="data.js"></script>
<script>
(function () {
  const MAP = window.MAP || { sections: [], notes: {}, examples: [] };
  const MODES = { df: 'Deadlock free', lf: 'Lock free' };
  let mode = 'df', pinned = null, query = '';
  try { const m = localStorage.getItem('lrmap-mode'); if (m && MODES[m]) mode = m; } catch (e) {}
  { const qm = new URLSearchParams(location.search).get('mode'); if (qm && MODES[qm]) mode = qm; }

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // inline `code` in prose fields
  // \annp{…} marks prose about annotations: dropped in the deadlock-free mode, coloured in the lock-free mode
  function annp(s) {
    s = String(s || ''); let out = '', i = 0;
    for (;;) {
      const j = s.indexOf('\\annp{', i); if (j < 0) return out + s.slice(i);
      let d = 1, k = j + 6;
      while (k < s.length && d) { if (s[k] === '\\') { k += 2; continue; } if (s[k] === '{') d++; else if (s[k] === '}') d--; k++; }
      out += s.slice(i, j) + (mode === 'lf' ? '\u0001' + annp(s.slice(j + 6, k - 1)) + '\u0002' : ''); i = k;
    }
  }
  const prose = s => esc(annp(s)).replace(/\u0001/g, '<span class="ann">').replace(/\u0002/g, '</span>').replace(/`([^`]+)`/g, '<code>$1</code>');
  // syntax highlighting for programs in the surface language
  const KW = new Set(['let', 'in', 'new', 'spawn', 'send', 'recv', 'close', 'select', 'branch', 'link', 'force', 'case', 'of', 'inl', 'inr', 'fix', 'box', 'fun', 'if', 'then', 'else', 'end', 'skip', 'rec']);
  function hl(code) {
    const re = /(\(\*[\s\S]*?\*\)|--[^\n]*)|(\b[A-Za-z_][A-Za-z0-9_']*\b)|(\b\d+\b)|([λ!?⊸⊗⊕→↦=<>|⟨⟩;.,+-]+)/g;
    let out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index)); last = re.lastIndex;
      if (m[1]) out += `<span class="com">${esc(m[1])}</span>`;
      else if (m[2]) out += KW.has(m[2]) ? `<span class="kw">${esc(m[2])}</span>` : (/^[A-Z]/.test(m[2]) ? `<span class="ty">${esc(m[2])}</span>` : esc(m[2]));
      else if (m[3]) out += `<span class="num">${esc(m[3])}</span>`;
      else out += `<span class="op">${esc(m[4])}</span>`;
    }
    return out + esc(code.slice(last));
  }
  // \htmlData{k=KEY}{…} (KaTeX style) becomes \class{k-KEY}{…} for MathJax
  // \annot{X} marks an annotation, \annraw{X} layout that belongs to one: kept (and coloured) in the lock-free mode, dropped otherwise
  // \dfo{X} is the deadlock-free reading of a part whose lock-free reading is an \annot: kept in the deadlock-free mode, dropped otherwise
  // colour an annotation, keeping a lone superscript attached to its base
  function colour(t) {
    if (t.startsWith('^{')) { let d = 1, k = 2; while (k < t.length && d) { if (t[k] === '\\') { k += 2; continue; } if (t[k] === '{') d++; else if (t[k] === '}') d--; k++; } if (k === t.length) return '^{\\class{ann}{' + t.slice(2, -1) + '}}'; }
    return '\\class{ann}{' + t + '}';
  }
  function annot(s, md = mode) {
    s = String(s || ''); let out = '', i = 0;
    for (;;) {
      const m = /\\(?:ann(ot|raw)|(dfo))\{/.exec(s.slice(i)); if (!m) return out + s.slice(i);
      const j = i + m.index, open = j + m[0].length;
      let d = 1, k = open;
      while (k < s.length && d) { if (s[k] === '\\') { k += 2; continue; } if (s[k] === '{') d++; else if (s[k] === '}') d--; k++; }
      const inner = annot(s.slice(open, k - 1), md);
      out += s.slice(i, j) + (m[2] ? (md !== 'lf' ? inner : '') : md !== 'lf' ? '' : m[1] === 'raw' ? inner : colour(inner)); i = k;
    }
  }
  const toMJ = (tex, m) => annot(tex, m).replace(/\\htmlData\{k=([A-Za-z0-9.\-_]+)\}\{/g, (_, k) => '\\class{k-' + k.replace(/\./g, '__') + '}{');
  const keyOf = el => { for (const c of el.classList) if (c.startsWith('k-')) return c.slice(2).replace(/__/g, '.'); return null; };
  const keysIn = tex => { const out = new Set(); String(tex || '').replace(/\\htmlData\{k=([A-Za-z0-9.\-_]+)\}/g, (_, k) => out.add(k)); return out; };

  // index: note key -> blocks using it
  const uses = {};
  for (const s of MAP.sections) for (const b of s.blocks) {
    const all = [b.tex, ...Object.values(b.variants || {})];
    for (const t of all) for (const k of keysIn(t)) (uses[k] = uses[k] || new Map()).set(b.id, { sec: s.id, title: b.title });
  }

  const sections = [...MAP.sections.map(s => ({ id: s.id, title: s.title })), { id: 'examples', title: 'Examples' }];
  function current() { const h = location.hash.slice(1); return sections.some(s => s.id === h) ? h : (sections[0] && sections[0].id); }

  function renderTabs() {
    const cur = current();
    $('#tabs').innerHTML = sections.map(s => `<a href="#${s.id}"${s.id === cur ? ' aria-current="page"' : ''}>${esc(s.title)}</a>`).join('');
  }
  function renderModes() {
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  }
  const matches = (...fields) => !query || fields.join(' ').toLowerCase().includes(query);

  function math(tex, m) {
    const div = document.createElement('div'); div.className = 'math';
    try { div.appendChild(MathJax.tex2svg(toMJ(tex, m), { display: true })); }
    catch (e) { div.textContent = tex; }
    return div;
  }

  // every hoverable entry gets a transparent rectangle over its whole box, drawn first inside the
  // entry, so gaps between glyphs count as inside and nested entries (drawn later) stay on top
  const hitAreas = [];
  function addHits(block) {
    block.querySelectorAll('.math [class*="k-"]').forEach(g => {
      if (g.querySelector(':scope > rect.lr-hit')) return;
      let b; try { b = g.getBBox(); } catch (e) { return; }
      if (!b || !b.width) return;
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', b.x - 40); r.setAttribute('y', b.y - 40);
      r.setAttribute('width', b.width + 80); r.setAttribute('height', b.height + 80);
      r.setAttribute('class', 'lr-hit');
      g.insertBefore(r, g.firstChild);
    });
  }
  // a block may be switched on its own between the two modes when they show it differently
  const local = new Map();
  const blockMode = b => local.get(b.id) || mode;
  const texOf = (b, m) => (b.variants && b.variants[m]) || b.tex;
  const differs = b => annot(texOf(b, 'df'), 'df') !== annot(texOf(b, 'lf'), 'lf');
  function flipBlock(id, m) {
    const b = MAP.sections.flatMap(x => x.blocks).find(x => x.id === id), el = document.getElementById('b-' + id);
    if (!b || !el) return;
    if (m === mode) local.delete(id); else local.set(id, m);
    el.querySelectorAll('.flip button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.m === m)));
    const old = el.querySelector(':scope > .math'), nu = math(texOf(b, m), m);
    old.replaceWith(nu); hotEl = null;
    requestAnimationFrame(() => addHits(el));
    if (pinned) { markAll(pinned); showNote(pinned, true, m); }
  }
  function renderSection() {
    const cur = current(), root = $('#content');
    root.innerHTML = '';
    if (cur === 'examples') return renderExamples(root);
    const s = MAP.sections.find(x => x.id === cur);
    if (!s) { root.innerHTML = '<p class="empty-state">No definitions loaded.</p>'; return; }
    idle({ title: s.title, what: s.intro });
    let shown = 0;
    for (const b of s.blocks) {
      const modes = b.modes && b.modes.length ? b.modes : ['df', 'lf'];
      if (!modes.includes(mode)) continue;
      const bm = blockMode(b), tex = texOf(b, bm);
      if (!tex || !matches(b.title, b.caption, b.rocq, tex)) continue;
      const lfOnly = !modes.includes('df');
      const el = document.createElement('article'); el.className = 'block' + (lfOnly ? ' lfonly' : ''); el.id = 'b-' + b.id;
      const tags = modes.length === 2 ? '' : `<span class="tags">${modes.map(m => `<span class="tag ${m}">${m === 'df' ? 'DF' : 'LF'}</span>`).join('')}</span>`;
      const flip = !lfOnly && differs(b) ? `<span class="tags"><span class="flip" data-flip="${esc(b.id)}">${['df', 'lf'].map(m => `<button type="button" data-m="${m}" aria-pressed="${bm === m}" title="Show this block ${m === 'df' ? 'without' : 'with'} the lock-free additions">${m === 'df' ? 'DF' : 'LF'}</button>`).join('')}</span></span>` : '';
      const plan = b.planned ? `<span class="tags"><span class="tag planned" title="${esc(b.planned)}">planned</span></span>` : '';
      el.innerHTML = `<h3 data-block="${esc(b.id)}" tabindex="0">${esc(b.title)}${tags}${plan}${flip}</h3>`;
      el.appendChild(math(tex, bm));
      hitAreas.push(el);
      root.appendChild(el); shown++;
    }
    if (!shown) root.insertAdjacentHTML('beforeend', '<p class="empty-state">Nothing in this section matches the filter for this instance.</p>');
    const todo = hitAreas.splice(0); requestAnimationFrame(() => todo.forEach(addHits));
    typeset(root);
    hotEl = null;
    if (pinned) markAll(pinned);
  }

  // one badge per judgment: accepted, rejected, or not attempted
  // each verdict says which judgment it is about and which property that judgment gives
  const JUDG = [['df', 'statically typed', 'deadlock free'], ['sem', 'semantically typed', 'deadlock free'], ['live', 'typed and guarded', 'live'], ['lf', 'statically typed', 'lock free']];
  function badges(acc) {
    if (!acc) return '';
    // the deadlock-free mode shows only the deadlock-free verdict
    return `<div class="badges">${JUDG.map(([m, sym, name]) => {
      const a = acc[m]; if (a === undefined || (mode === 'df' && m !== 'df' && m !== 'sem')) return '';
      const st = a === true || (a && a.ok) ? 'yes' : a === false || (a && a.ok === false) ? 'no' : 'na';
      const extra = (a && a.N !== undefined ? ` <span class="n">at ${a.N === 'every' ? 'every $N$' : `$N = ${esc(a.N)}$`}</span>` : '') + (a && a.part ? ` <span class="nm">(${st === 'no' ? 'fails at ' : ''}${esc(a.part)})</span>` : '');
      const title = a && a.rocq ? ` title="${esc(a.rocq)}"` : '';
      return `<span class="badge ${st} ${m}"${title}><span class="mark">${st === 'yes' ? '✓' : st === 'no' ? '✗' : '–'}</span> ${st === 'no' ? 'not ' : ''}${sym}, <span class="nm">${name}</span>${extra}</span>`;
    }).join('')}</div>`;
  }
  function renderExamples(root) {
    idle({ title: 'Examples', what: 'Typed programs. The badges show which judgments accept each one. Point at a title for what it demonstrates.' });
    let shown = 0;
    for (const x of MAP.examples || []) {
      const modes = x.modes && x.modes.length ? x.modes : ['df', 'lf'];
      if (!modes.includes(mode) || !matches(x.title, x.shows, x.code, x.rocq)) continue;
      root.insertAdjacentHTML('beforeend', `<article class="ex${modes.includes('df') ? '' : ' lfonly'}" id="x-${esc(x.id)}"><h3 data-ex="${esc(x.id)}" tabindex="0">${esc(x.title)}</h3>${badges(x.accepts)}${x.lead ? `<p class="lead">${prose(x.lead)}</p>` : ''}${x.code ? `<pre>${hl(x.code)}</pre>` : ''}${x.shows ? `<p>${prose(x.shows)}</p>` : ''}</article>`);
      shown++;
    }
    if (!shown) root.insertAdjacentHTML('beforeend', '<p class="empty-state">No example for this instance matches the filter.</p>');
    typeset(root);
  }

  // typeset inline $…$ math in prose (captions, intros, notes)
  function typeset(el) { if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([el]).catch(() => {}); }

  const noteCache = new Map();
  function noteBody(key) {
    const ck = mode + ' ' + key;
    if (noteCache.has(ck)) return noteCache.get(ck);
    const n = MAP.notes[key], body = document.createElement('div');
    if (!n) { body.innerHTML = `<div class="placeholder">No note for <code>${esc(key)}</code>.</div>`; noteCache.set(ck, body); return body; }
    const args = as => Array.isArray(as) && as.length ? `<div><dt>Arguments</dt><dd><ul class="args">${as.filter(x => !x.ann || mode === 'lf').map(x => `<li>$${esc(annot(x.name))}$ ${prose(annot(x.meaning))}</li>`).join('')}</ul></dd></div>` : '';
    const row = (t, v, cls) => { const w = v ? prose(annot(v)) : ''; return w.replace(/<[^>]*>/g, '').trim() ? `<div><dt>${t}</dt><dd${cls ? ` class="${cls}"` : ''}>${w}</dd></div>` : ''; };
    const u = uses[key] ? [...uses[key].entries()] : [];
    body.innerHTML = `<h2>${esc(annot(n.title || key))}</h2>
      <dl>${n.sig ? `<div><dt>Type</dt><dd class="sig">$\\displaystyle ${esc(annot(n.sig))}$</dd></div>` : ''}${args(n.args)}${row('What', n.what)}${row('Why', n.why)}${row('Without it', n.breaks, 'breaks')}${row('Example', n.example)}${row('Rocq', n.rocq)}</dl>
      ${Array.isArray(n.used) && n.used.length ? `<div class="uses">Used in<div class="chips">${n.used.map(id => { const s = MAP.sections.find(x => x.blocks.some(b => b.id === id)); const b = s && s.blocks.find(b => b.id === id); return b ? `<a href="#${s.id}" data-jump="${esc(id)}">${esc(b.title)}</a>` : ''; }).join('')}</div></div>` : ''}
      ${u.length > 1 ? `<div class="uses">Also in<div class="chips">${u.map(([id, v]) => `<a href="#${v.sec}" data-jump="${esc(id)}">${esc(v.title)}</a>`).join('')}</div></div>` : ''}`;
    noteCache.set(ck, body);
    body.dataset.fresh = '1';
    return body;
  }
  // a block's own note: its caption, and why it is there, what breaks without it and where it is used
  function blockNote(id) {
    const b = MAP.sections.flatMap(x => x.blocks).find(x => x.id === id); if (!b) return null;
    const a = b.about || {};
    return pseudo('b-' + b.id, { title: b.title, what: b.caption, why: a.why, breaks: a.breaks, example: a.example, rocq: b.rocq, used: a.used });
  }
  // an example's own note: what it demonstrates, then how
  function exNote(id) {
    const x = (MAP.examples || []).find(x => x.id === id); if (!x) return null;
    return pseudo('x-' + x.id, { title: x.title, what: [x.lead, x.shows].filter(Boolean).join(' '), rocq: x.rocq });
  }
  // a note built from a block's caption, an example's description, or a section intro
  function pseudo(id, n) {
    if (!MAP.notes['@' + id]) MAP.notes['@' + id] = n;
    return '@' + id;
  }
  function idle(n) {
    if (pinned || matchMedia('(max-width: 900px)').matches) return;
    const k = pseudo('sec-' + (n.title || ''), n);
    shownKey = null; showNote(k, false);
  }
  let shownKey = null, shownPinned = null, shownMode = null;
  // the mode a note is read in: the mode of the block it was reached from, which its own switch may change
  const modeAt = el => { const art = el && el.closest && el.closest('article.block'); return art ? (local.get(art.id.slice(2)) || mode) : mode; };
  // tell the local server (serve.sh) what the reader points at, so the assistant can follow along
  let lastBlock = null, reportTimer = null;
  function report(extra) {
    if (!/^https?:$/.test(location.protocol) || !/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) return;
    clearTimeout(reportTimer);
    reportTimer = setTimeout(() => {
      const st = { t: new Date().toISOString(), section: current(), mode, block: lastBlock, pinned, ...extra };
      fetch('cursor', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(st) }).catch(() => {});
    }, 250);
  }
  function showNote(key, isPinned, nm = mode) {
    report({ key, title: (MAP.notes[key] || {}).title || null, how: isPinned ? 'pin' : 'hover' });
    if (key === shownKey && isPinned === shownPinned && nm === shownMode) return;
    shownMode = nm;
    shownKey = key; shownPinned = isPinned;
    const aside = $('#note');
    aside.classList.remove('empty');
    aside.replaceChildren();
    aside.insertAdjacentHTML('beforeend', `<div class="eyebrow"><span>${isPinned ? 'Pinned' : 'Hover'}</span>${isPinned ? '<button type="button" id="unpin">Unpin</button>' : ''}</div>`);
    const saved = mode; mode = nm; const body = noteBody(key); mode = saved; aside.appendChild(body);
    if (body.dataset.fresh) { delete body.dataset.fresh; typeset(body); }
  }
  // a light box behind an entry, drawn inside its own coordinate system
  function boxOn(el, cls) {
    let b; try { b = el.getBBox(); } catch (e) { return; }
    if (!b || !b.width) return;
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    const pad = 20; // the box already includes the hit area's margin
    r.setAttribute('x', b.x - pad); r.setAttribute('y', b.y - pad);
    r.setAttribute('width', b.width + 2 * pad); r.setAttribute('height', b.height + 2 * pad);
    r.setAttribute('rx', 80); r.setAttribute('class', 'lr-box ' + cls);
    el.insertBefore(r, el.firstChild);
  }
  function boxesOff(cls) { document.querySelectorAll('.math rect.lr-box.' + cls).forEach(r => r.remove()); }
  function markAll(key) {
    boxesOff('pin');
    const c = 'k-' + key.replace(/\./g, '__');
    document.querySelectorAll('.math .' + CSS.escape(c)).forEach(e => boxOn(e, 'pin'));
  }
  let hotEl = null;
  function hot(el) {
    if (el === hotEl) return;
    boxesOff('hot'); hotEl = el;
    if (el) boxOn(el, 'hot');
  }

  const content = $('#content');
  content.addEventListener('mouseover', e => {
    const art = e.target.closest && e.target.closest('article'); if (art) lastBlock = art.id;
    const h = e.target.closest && e.target.closest('h3[data-block], h3[data-ex]');
    if (h && !pinned) {
      if (h.dataset.block) { const k = blockNote(h.dataset.block); if (k) showNote(k, false, modeAt(h)); }
      else { const k = exNote(h.dataset.ex); if (k) showNote(k, false); }
      return;
    }
    const t = e.target.closest && e.target.closest('[class*="k-"]'); if (!t) return;
    const k = keyOf(t); if (!k) return;
    hot(t); if (!pinned) showNote(k, false, modeAt(t));
  });
  let outTimer = null;
  content.addEventListener('mouseout', e => {
    if (e.relatedTarget && content.contains(e.relatedTarget) && e.relatedTarget.closest('[class*="k-"]')) return;
    clearTimeout(outTimer); outTimer = setTimeout(() => hot(null), 150);
  });
  content.addEventListener('mouseover', () => clearTimeout(outTimer), true);
  content.addEventListener('click', e => {
    const fb = e.target.closest && e.target.closest('.flip button');
    if (fb) { flipBlock(fb.closest('.flip').dataset.flip, fb.dataset.m); return; }
    const hb = e.target.closest && e.target.closest('h3[data-block]');
    if (hb) { const k = blockNote(hb.dataset.block); if (k) { pinned = k; boxesOff('pin'); showNote(k, true, modeAt(hb)); } return; }
    // a click anywhere on an example pins its description
    const xa = e.target.closest && e.target.closest('article.ex');
    if (xa) { const k = exNote(xa.id.slice(2)); if (k) { pinned = k; boxesOff('pin'); showNote(k, true); } return; }
    const t = e.target.closest && e.target.closest('[class*="k-"]'); if (!t) return;
    const k = keyOf(t); if (!k) return;
    pinned = k; markAll(k); showNote(k, true, modeAt(t));
  });
  $('#note').addEventListener('click', e => {
    if (e.target.id === 'unpin') { pinned = null; shownKey = null; boxesOff('pin'); $('#note').classList.add('empty'); $('#note').innerHTML = '<div class="placeholder">Hover over a part of a formula.</div>'; }
    const j = e.target.dataset && e.target.dataset.jump;
    if (j) setTimeout(() => { const el = document.getElementById('b-' + j); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400); } }, 60);
  });
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode; local.clear(); try { localStorage.setItem('lrmap-mode', mode); } catch (e) {}
    report({ how: 'mode' });
    renderModes(); renderSection();
    if (pinned) { shownKey = null; showNote(pinned, true); }
  }));
  $('#q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderSection(); });
  window.addEventListener('hashchange', () => { renderTabs(); renderSection(); window.scrollTo(0, 0); report({ how: 'section' }); });

  // under serve.sh, reload when explorer.html or data.js changes, keeping the scroll position and the pinned note
  function watch() {
    if (!/^https?:$/.test(location.protocol) || !/^(127\.0\.0\.1|localhost)$/.test(location.hostname)) return;
    let seen = null;
    setInterval(() => fetch('version', { cache: 'no-store' }).then(r => r.ok ? r.text() : null).then(v => {
      if (!v) return;
      if (seen !== null && v !== seen) {
        try { sessionStorage.setItem('lrmap-keep', JSON.stringify({ y: window.scrollY, pinned })); } catch (e) {}
        location.reload();
      }
      seen = v;
    }).catch(() => {}), 1000);
  }
  function restore() {
    let k = null; try { k = JSON.parse(sessionStorage.getItem('lrmap-keep')); sessionStorage.removeItem('lrmap-keep'); } catch (e) {}
    if (!k) return;
    setTimeout(() => { window.scrollTo(0, k.y || 0); if (k.pinned && MAP.notes[k.pinned]) { pinned = k.pinned; markAll(pinned); showNote(pinned, true); } }, 300);
  }
  function start() { renderTabs(); renderModes(); renderSection(); restore(); watch(); }
  if (window.MathJax && MathJax.tex2svg) start(); else window.__mjReady = start;
})();
</script>
