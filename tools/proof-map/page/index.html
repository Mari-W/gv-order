<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proof Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* One page renders any proof-map/1 JSON. Layout: sticky header (title, modes, filter, theme,
   sections), the blocks of one section on the left, the note panel on the right, a bottom sheet
   on narrow screens. Nothing scrolls sideways: formulas shrink to their column. */
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --sunk: #eef0f3;
  --ink: #1c2027;
  --muted: #5d6470;
  --line: #e1e4e9;
  --line-strong: #c9ced6;
  --accent: #2e5c8a;
  --accent-soft: #e5edf6;
  --hot: #b26f12;
  --hot-soft: #fcefd8;
  --warn: #a8432f;
  --warn-soft: #f8e3dc;
  --plan: #6b6f5a;
  --code-kw: #8a3f8f;
  --code-ty: #1f6f6b;
  --code-op: #5d6470;
  --display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  --shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 1px 3px rgb(16 24 40 / 0.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101317; --surface: #161a1f; --sunk: #1d2228; --ink: #e5e7ea; --muted: #99a1ac; --line: #252b32; --line-strong: #353c46;
  --accent: #8db3de; --accent-soft: #1d2836; --hot: #e3a750; --hot-soft: #352916; --warn: #ec8f78; --warn-soft: #3b2420; --plan: #b5b89f;
  --code-kw: #d59ad9; --code-ty: #7fcfc8; --code-op: #99a1ac; --shadow: none; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101317; --surface: #161a1f; --sunk: #1d2228; --ink: #e5e7ea; --muted: #99a1ac; --line: #252b32; --line-strong: #353c46;
  --accent: #8db3de; --accent-soft: #1d2836; --hot: #e3a750; --hot-soft: #352916; --warn: #ec8f78; --warn-soft: #3b2420; --plan: #b5b89f;
  --code-kw: #d59ad9; --code-ty: #7fcfc8; --code-op: #99a1ac; --shadow: none; color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); overflow-wrap: break-word; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
a { color: var(--accent); }
code, kbd { font-family: var(--mono); font-size: 0.86em; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }

/* header */
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px 8px; max-width: 2400px; margin: 0 auto; }
.brand { min-width: 0; margin-right: auto; }
h1 { font: 600 1.3rem/1.2 var(--display); margin: 0; letter-spacing: 0.002em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 0.86rem; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; font-size: 0.86rem; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
.seg button[aria-pressed="true"] .dot { opacity: 1; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; opacity: 0.55; }
.search { position: relative; flex: 1 1 200px; max-width: 320px; }
.search input { width: 100%; font: 0.9rem var(--body); padding: 6px 10px 6px 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--muted); fill: none; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; }
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.icon-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; max-width: 2400px; margin: 0 auto; padding-bottom: 6px; }
nav.tabs a { font-size: 0.9rem; font-weight: 500; color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 6px; }
nav.tabs a:hover { color: var(--ink); background: var(--sunk); }
nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--accent-soft); }
nav.tabs .count { font-size: 0.72rem; color: var(--accent); margin-left: 5px; font-weight: 600; }
nav.tabs a.none { opacity: 0.45; }

/* main grid */
main { display: grid; grid-template-columns: minmax(0, 1fr) clamp(320px, 27vw, 520px); gap: 28px; max-width: 2400px; margin: 0 auto; padding-block: 22px 80px; }
@media (max-width: 960px) { main { grid-template-columns: minmax(0, 1fr); padding-bottom: 52vh; } }
#content { min-width: 0; }
.intro { font: 1.12rem/1.6 var(--display); max-width: 70ch; margin: 0 0 10px; }
.toc { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 22px; padding: 0; list-style: none; }
.toc a { font-size: 0.8rem; color: var(--muted); text-decoration: none; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.toc a:hover { color: var(--accent); border-color: var(--accent); }
.conventions { margin: 0 0 22px; padding: 12px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius); font-size: 0.92rem; }
.conventions h2 { font: 600 0.74rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.conventions dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; }
.conventions dd { margin: 0; }

/* blocks */
.block, .ex { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
.block.only { background: color-mix(in srgb, var(--mc) 6%, var(--surface)); border-color: color-mix(in srgb, var(--mc) 35%, var(--line)); }
.block.flash, .ex.flash { box-shadow: 0 0 0 2px var(--hot); }
.bhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.bhead h3 { font: 600 1rem/1.35 var(--body); margin: 0; cursor: pointer; min-width: 0; }
.bhead h3:hover { color: var(--accent); }
.bhead .tools { margin-left: auto; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.src { display: block; font: 0.74rem/1.4 var(--mono); color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
article.block > .src, article.ex > .src { display: none; margin-top: 8px; }
article.block.showsrc > .src, article.ex.showsrc > .src { display: block; }
.tbtn[aria-pressed="true"] { color: var(--accent); }
aside details.rocq summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
.tag { font: 600 0.66rem/1.5 var(--body); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 6px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
.tag.mode { color: var(--mc); }
.tag.planned { color: var(--plan); border-style: dashed; }
.tag.ax { color: var(--muted); text-transform: none; }
.tag.dev { color: var(--muted); }
.tag.missing { color: var(--warn); }
.mini { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.mini button { border: 0; background: transparent; padding: 0 7px; font: 600 0.66rem/1.7 var(--body); letter-spacing: 0.05em; color: var(--muted); cursor: pointer; }
.mini button[aria-pressed="true"] { background: var(--mc); color: var(--surface); }
.tbtn { border: 0; background: transparent; padding: 2px; cursor: pointer; color: var(--muted); border-radius: 4px; display: inline-flex; }
.tbtn:hover { color: var(--ink); background: var(--sunk); }
.tbtn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.math { margin: 10px 0 4px; min-width: 0; }
.math mjx-container[display="true"] { display: block !important; margin: 0 !important; max-width: 100%; min-width: 0 !important; text-align: center; }
.math mjx-container svg { max-width: 100% !important; height: auto !important; }
.math[data-split] > mjx-container + mjx-container { margin-top: 0.9em !important; }
mjx-container { user-select: text; }
mjx-container.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 3px; }
.ptable { display: grid; grid-template-columns: var(--cols, max-content minmax(0, 1fr)); gap: 0 20px; align-items: baseline; margin: 12px 0 4px; }
.ptable > * { padding: 7px 0; min-width: 0; }
.ptable > .rule { border-top: 1px solid var(--line); }
.ptable .th { font: 600 0.7rem/1.4 var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 0 0 6px; border-bottom: 1px solid var(--line-strong); align-self: end; }
.ptable .lab { font-size: 0.92rem; color: var(--muted); }
.ptable .lab[class*="k-"] { cursor: help; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; justify-self: start; }
.ptable .lab[class*="k-"]:hover, .ptable .lab.hot { color: var(--ink); background: var(--hot-soft); }
.ptable .math { margin: 0; }
.ptable .math mjx-container { text-align: left !important; }
.ptable .txt { font-size: 0.95rem; }
.ptable .al-r { justify-self: end; text-align: right; } .ptable .al-c { justify-self: center; text-align: center; }
.ptable .al-c mjx-container { text-align: center !important; } .ptable .al-r mjx-container { text-align: right !important; }
@media (max-width: 700px) {
  .ptable { grid-template-columns: minmax(0, 1fr) !important; }
  .ptable > * { grid-column: 1 / -1 !important; padding: 2px 0; }
  .ptable .th { display: none; }
  .ptable .lab { padding-top: 10px; font-weight: 600; }
  .ptable .cell[data-head]::before { content: attr(data-head); display: block; font: 600 0.66rem var(--body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .ptable > .cell.rule, .ptable > .lab ~ .cell { border-top: 0; }
  .ptable .al-r, .ptable .al-c { justify-self: start; text-align: left; }
  .ptable .al-r mjx-container, .ptable .al-c mjx-container { text-align: left !important; }
  .ptable .txt:empty { display: none; }
}
.caption { color: var(--muted); font-size: 0.95rem; margin: 8px 0 0; max-width: 78ch; }
.devs { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.devs li { display: flex; gap: 8px; align-items: baseline; font-size: 0.88rem; padding: 6px 10px; border-radius: 8px; background: var(--sunk); }
.devs li .tag { flex: none; }
.devs li.missing { background: var(--warn-soft); }
.devs li.missing .reason { color: var(--warn); font-weight: 600; }
.devs .part { font-size: 0.82rem; color: var(--muted); }

/* Targets. At rest every glyph of a target in a formula carries a hairline under it, drawn once
   for the innermost target that owns the glyph: dotted when the target shows a note, solid when a
   click also opens the block that defines it. Under the cursor the innermost target gets a box and
   the targets around it a hairline outline. Prose links are solid, table labels with a note dotted. */
mjx-container [class*="k-"] { cursor: help; }
mjx-container .pm-go { cursor: pointer; }
mjx-container .pm-uls { pointer-events: none; }
mjx-container .pm-ul { fill: none; stroke: color-mix(in srgb, var(--accent) 70%, transparent); stroke-linecap: round; }
mjx-container .pm-ul.go { stroke: color-mix(in srgb, var(--accent) 50%, transparent); stroke-linecap: butt; }
.math rect.pm-hit { fill: transparent; stroke: none; pointer-events: all; }
mjx-container rect.pm-box { fill: var(--hot-soft); stroke: var(--hot); stroke-width: 14; pointer-events: none; }
mjx-container rect.pm-box.pin { stroke-width: 30; }
mjx-container rect.pm-box.anc { fill: none; stroke: color-mix(in srgb, var(--hot) 60%, transparent); stroke-width: 1; vector-effect: non-scaling-stroke; }
a.xref { text-decoration: underline 1px color-mix(in srgb, var(--accent) 45%, transparent); text-underline-offset: 2px; }
a.xref:hover { text-decoration-color: var(--accent); }
.ptable .lab.pm-go { cursor: pointer; text-decoration-style: solid; }
.planned { opacity: 0.6; }

/* note panel */
aside { position: sticky; top: var(--head, 110px); align-self: start; max-height: calc(100vh - var(--head, 110px) - 16px); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px 18px; min-width: 0; }
aside::-webkit-scrollbar { display: none; }
@media (max-width: 960px) {
  aside { position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 48vh; border-radius: 14px 14px 0 0; z-index: 6; box-shadow: 0 -8px 28px rgb(0 0 0 / 0.14);
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
  aside.empty { display: none; }
}
.eyebrow { display: flex; justify-content: space-between; align-items: center; font: 600 0.7rem var(--body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.eyebrow button { font: 500 0.76rem var(--body); letter-spacing: 0; text-transform: none; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 6px; padding: 1px 8px; cursor: pointer; }
aside h2 { font: 600 1.3rem/1.3 var(--display); margin: 6px 0 12px; text-wrap: balance; }
aside dl { margin: 0; display: grid; gap: 12px; }
aside dt { font: 600 0.7rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
aside dd { margin: 2px 0 0; font-size: 0.97rem; min-width: 0; }
aside dd.breaks { border-left: 3px solid var(--hot); padding-left: 10px; }
aside dd.sig { overflow: hidden; }
aside mjx-container { max-width: 100%; }
aside mjx-container svg { max-width: 100% !important; height: auto !important; }
aside dd.sig mjx-container { display: block !important; margin: 4px 0 !important; min-width: 0 !important; text-align: left !important; }
aside ul.args { margin: 2px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.93rem; }
aside .refs { list-style: none; padding: 0; margin: 2px 0 0; display: grid; gap: 2px; font: 0.8rem/1.45 var(--mono); }
aside .refs .q { color: var(--muted); font-family: var(--body); }
aside .uses { margin-top: 16px; }
aside .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
aside .chips a, aside .chips span { font-size: 0.82rem; color: var(--accent); text-decoration: none; padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); max-width: 100%; overflow-wrap: anywhere; cursor: pointer; }
aside .chips a:hover { border-color: var(--accent); }
.eyebrow .hint { font: 400 0.74rem var(--body); letter-spacing: 0; text-transform: none; color: var(--muted); margin-left: auto; padding-left: 10px; text-align: right; }
.eyebrow .hint + button { margin-left: 8px; }
aside .placeholder { color: var(--muted); font-size: 0.93rem; }
aside .devs li { font-size: 0.86rem; }

/* examples */
.ex pre { margin: 10px 0; padding: 12px 14px; background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 0.84rem/1.55 var(--mono); }
.ex pre .kw { color: var(--code-kw); font-weight: 500; }
.ex pre .ty { color: var(--code-ty); }
.ex pre .op { color: var(--code-op); }
.ex pre .com { color: var(--muted); font-style: italic; }
.ex pre .num { color: var(--hot); }
.ex p { margin: 6px 0 0; font-size: 0.95rem; }
.ex p.lead { font-family: var(--display); font-size: 1.02rem; }
.empty-state { color: var(--muted); padding: 30px 0; }
.empty-state a { margin-right: 10px; }

/* opening a map by hand */
.drop { border: 2px dashed var(--line-strong); border-radius: var(--radius); padding: 30px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 14px; border-radius: 8px; font-size: 0.86rem; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .block, .ex { transition: box-shadow .25s; } }
@media print { header, aside { display: none; } main { display: block; } .block { break-inside: avoid; } }
</style>
<style id="mode-css"></style>
</head>
<body>
<header class="wrap">
  <div class="bar">
    <div class="brand"><h1 id="title">Proof Map</h1><p id="subtitle"></p></div>
    <div class="seg" id="modes" role="group" hidden></div>
    <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 4 4"/></svg><input id="q" type="search" placeholder="Filter  ( / )" aria-label="Filter blocks and examples" autocomplete="off"></label>
    <button class="icon-btn" id="theme" type="button" title="Theme: follows the system"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/></svg><span>Auto</span></button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</header>
<main class="wrap">
  <section id="content" aria-live="polite"><p class="empty-state">Loading the map…</p></section>
  <aside id="note" class="empty" aria-label="Note"><div class="placeholder">Point at a part of a formula or at a title.</div></aside>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
// Extensions call ProofMap.register({...}) from the scripts the map lists under extensions.page.
window.ProofMap = { exts: [], register(e) { this.exts.push(e); } };
window.MathJax = {
  loader: { load: ['[tex]/html'] },
  tex: { inlineMath: [['$', '$']], processEscapes: true, packages: { '[+]': ['html'] } },
  svg: { fontCache: 'global' },
  startup: { typeset: false, ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => window.__mjReady && window.__mjReady()); } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js"></script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k) { try { return localStorage.getItem('proofmap:' + k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('proofmap:' + k, v); } catch (e) {} } };
  const params = new URLSearchParams(location.search);
  const ICON = {
    copy: '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>',
    link: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.6-2.6a3 3 0 0 0-4.2-4.2L8 3.8"/><path d="M9.5 6.5a3 3 0 0 0-4.2 0L2.7 9.1a3 3 0 0 0 4.2 4.2L8 12.2"/></svg>',
    code: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4 2 8l3.5 4"/><path d="M10.5 4 14 8l-3.5 4"/></svg>'
  };

  // ---------- theme ----------
  const THEMES = ['auto', 'light', 'dark'];
  let theme = store.get('theme') || 'auto';
  function applyTheme() {
    if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
    const b = $('#theme'); b.querySelector('span').textContent = theme[0].toUpperCase() + theme.slice(1);
    b.title = theme === 'auto' ? 'Theme: follows the system' : 'Theme: ' + theme;
  }
  applyTheme();
  $('#theme').addEventListener('click', () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set('theme', theme); applyTheme(); });

  // ---------- loading ----------
  function xhr(url, asText) {
    return new Promise((ok, fail) => {
      const r = new XMLHttpRequest();
      r.open('GET', url); r.responseType = 'text';
      r.onload = () => (r.status === 200 || (r.status === 0 && r.responseText)) ? ok(r.responseText) : fail(new Error(url + ': ' + r.status));
      r.onerror = () => fail(new Error(url + ': cannot load'));
      r.send();
    });
  }
  const script = src => new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error(src)); document.head.appendChild(s); });
  async function loadMap() {

        const k = keyOf(t); if (!k) return;
        const md = modeAt(t), from = blockAt(t), d = defOf(k, md);
        pin(k, md, from);
        if (d && d !== from && !e.shiftKey && !e.altKey) goTo(d, from);
        return;
      }
      const xa = e.target.closest('article.ex'); if (xa) pin('@x:' + xa.id.slice(2), mode);
    });
    content.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('h3[data-block], h3[data-ex]')) e.target.click(); });
    $('#note').addEventListener('click', e => {
      if (e.target.id === 'unpin') { unpin(); return; }
      const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); goTo(j.dataset.jump); return; }
      const t = e.target.closest('[class*="k-"]'), k = t && keyOf(t); if (!k) return;
      const d = defOf(k); pin(k, mode); if (d && !e.shiftKey && !e.altKey) goTo(d);
    });
    $('#modes').addEventListener('click', e => {
      const b = e.target.closest('button[data-mode]'); if (!b) return;
      mode = b.dataset.mode; local.clear(); store.set('mode:' + MAP.title, mode);
      const u = new URL(location.href); u.searchParams.set('mode', mode); history.replaceState(null, '', u);
      renderModes(); renderTabs(); renderSection();
      if (pinned) { shown = null; showNote(pinned, true); }
    });
    let qt = null;
    $('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { query = e.target.value.trim(); renderTabs(); renderSection(); }, 90); });
    addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
      else if (e.key === 'Escape') { if (document.activeElement === $('#q') && query) { $('#q').value = ''; query = ''; renderTabs(); renderSection(); } else if (pinned) unpin(); }
    });
    addEventListener('hashchange', () => { const before = renderSection.sec, r = route(); if (before !== r.sec) { renderTabs(); renderSection(); scrollTo(0, 0); } else if (r.block) jump(r.block); renderSection.sec = r.sec; renderTabs(); });
    let lastW = innerWidth;
    addEventListener('resize', () => {
      document.documentElement.style.setProperty('--head', ($('header').offsetHeight + 12) + 'px');
      // a width change of more than 15 % may split or join formulas: render again
      clearTimeout(wire.rt); wire.rt = setTimeout(() => { if (Math.abs(innerWidth - lastW) > 0.15 * lastW) { lastW = innerWidth; const y = scrollY; renderSection(); scrollTo(0, y); } }, 250);
    });
  }
  // from: the block the reader leaves, recorded in the history so that Back returns to it
  function goTo(id, from) {
    const x = blockIndex.get(id), e = (MAP.examples || []).find(e => e.id === id);
    const sec = x ? x.s.id : e ? 'examples' : null; if (!sec) return;
    if (x && !visible(x.b)) { mode = x.b.modes[0]; renderModes(); }
    if (query && !(x ? matches(blockHay(x.b)) : matches(exHay(e)))) { query = ''; $('#q').value = ''; }
    if (from && blockIndex.has(from)) { history.replaceState(null, '', '#' + route().sec + '/' + from); location.hash = sec + '/' + id; return; }
    if (route().sec !== sec) { location.hash = sec + '/' + id; } else { history.replaceState(null, '', '#' + sec + '/' + id); jump(id); }
  }

  // under serve.py, reload when the page or the map changes, keeping the scroll position and pin
  function watch() {
    if (!/^https?:$/.test(location.protocol)) return;
    let seen = null;
    const tick = () => xhr('__version?map=' + encodeURIComponent(params.get('map') || 'map.json')).then(v => {
      if (seen !== null && v !== seen) { try { sessionStorage.setItem('proofmap:keep', JSON.stringify({ y: scrollY, pinned })); } catch (e) {} location.reload(); }
      seen = v; setTimeout(tick, 1000);
    }).catch(() => {});
    tick();
  }
  function restore() {
    let k = null; try { k = JSON.parse(sessionStorage.getItem('proofmap:keep')); sessionStorage.removeItem('proofmap:keep'); } catch (e) {}
    if (k) setTimeout(() => { scrollTo(0, k.y || 0); if (k.pinned) pin(k.pinned, mode); }, 300);
    // ?note=KEY opens with that note pinned, for links to a symbol
    else if (params.get('note')) setTimeout(() => pin(params.get('note'), mode), 200);
  }

  // ---------- start ----------
  async function start(map, base) {
    MAP = map;
    if (!MAP || MAP.format !== 'proof-map/1') { askForFile(new Error('not a proof-map/1 file')); return; }
    document.title = MAP.title;
    $('#title').textContent = MAP.title; $('#subtitle').textContent = MAP.subtitle || '';
    MODES = (MAP.modes && MAP.modes.options) || [];
    const want = params.get('mode') || store.get('mode:' + MAP.title);
    mode = MODES.length ? (MODES.some(m => m.id === want) ? want : MAP.modes.default) : null;
    if (MAP.tex && MAP.tex.macros) { const tex = MathJax.config.tex; tex.macros = Object.assign({}, tex.macros, MAP.tex.macros); MathJax.startup.getComponents(); }
    blockIndex = new Map(MAP.sections.flatMap(s => s.blocks.map(b => [b.id, { s, b }])));
    indexUses();
    for (const src of (base && MAP.extensions && MAP.extensions.page) || []) { try { await script(new URL(src, base).href); } catch (e) { console.warn('extension not loaded', src); } }
    const css = window.ProofMap.exts.map(e => e.css || '').join('\n'); if (css) document.head.insertAdjacentHTML('beforeend', `<style>${css}</style>`);
    modeCSS(); renderModes(); renderTabs(); renderSection.sec = route().sec; renderSection(); wire(); restore(); watch();
  }
  async function boot() {
    try { const { map, base } = await loadMap(); await start(map, base); }
    catch (e) { console.error(e); askForFile(e); }
  }
  if (window.MathJax && MathJax.tex2svg) boot(); else window.__mjReady = boot;
})();
</script>
</body>
