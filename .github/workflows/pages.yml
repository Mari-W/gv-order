# Check the relation map against theories/ and publish it on GitHub Pages.
# The page is tools/proof-map/page/index.html, which reads map.json and ext/.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: MathJax for the render check
        run: npm install --prefix tools/proof-map --no-save --no-package-lock mathjax-full@3.2.2

      - name: Check the map
        run: sh docs/explorer/check.sh

      - name: Assemble the site
        run: |
          mkdir -p _site/ext
          cp tools/proof-map/page/index.html _site/index.html
          cp docs/explorer/map.json _site/map.json
          cp docs/explorer/ext/*.js _site/ext/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
